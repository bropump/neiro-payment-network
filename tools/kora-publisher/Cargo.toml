[package]
name = "neiro-kora-publisher"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[dependencies]
kora-lib = { git = "https://github.com/solana-foundation/kora", rev = "e77089ee00eaef212740fe24f534155c13a7bbb6" }
anyhow = "1.0"
serde_json = "1.0"
solana-client = "4.2.1"
solana-sdk = "4.0.1"
solana-message = { version = ">=4.4.0,<4.5", features = ["wincode"] }
solana-transaction = { version = ">=4.1.1,<4.2", features = ["wincode"] }
solana-system-interface = "2.0.0"
solana-commitment-config = "3.1.1"
solana-keychain = { version = "2.0.0", default-features = false, features = ["all", "sdk-v4"] }
spl-record = { version = "0.4.0", features = ["no-entrypoint"] }
bincode = "1.3.3"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13.2", features = ["json"] }

[dev-dependencies]
async-trait = "0.1"
base64 = "0.22.1"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = "symbols"
