name: Latest official Kora main
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Inspect secret-free Bunny overview and public Kora state
        env:
          BUNNY_KORA_APP_ID: ${{ vars.BUNNY_KORA_APP_ID }}
          BUNNY_KORA_CONTAINER_NAME: ${{ vars.BUNNY_KORA_CONTAINER_NAME }}
          BUNNY_KORA_API_KEY: ${{ secrets.BUNNY_KORA_API_KEY }}
        run: node scripts/rollout-metadata.mjs
