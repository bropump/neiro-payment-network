name: Inspect Bunny metadata rollout
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bunny-metadata-read-only-inspection
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: operator-maintenance
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Read secret-free platform overview and public Kora methods
        env:
          BUNNY_KORA_APP_ID: ${{ vars.BUNNY_KORA_APP_ID }}
          BUNNY_KORA_CONTAINER_NAME: ${{ vars.BUNNY_KORA_CONTAINER_NAME }}
          BUNNY_KORA_API_KEY: ${{ secrets.BUNNY_KORA_API_KEY }}
        run: node scripts/rollout-metadata.mjs
