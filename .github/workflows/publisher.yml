name: Operator listing runner
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: operator-listing-publisher-build
  cancel-in-progress: false
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install locked JavaScript dependencies without install scripts
        working-directory: tools/kora-publisher/script
        run: npm ci --ignore-scripts --no-fund --registry=https://registry.npmjs.org
      - name: Check strict TypeScript
        working-directory: tools/kora-publisher/script
        run: npm run typecheck
      - name: Test script and client checks
        working-directory: tools/kora-publisher/script
        run: npm test
  package:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Package script for Bunny hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf %s "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/bropump/neiro-kora-publisher:$GITHUB_SHA"
          docker build -f tools/kora-publisher/script/Dockerfile -t "$image" tools/kora-publisher
          docker run --rm --entrypoint node "$image" /app/script/runner.ts --help
          docker push "$image"
          docker logout ghcr.io
