name: Operator listing publisher
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: operator-listing-publisher-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned compiler and native dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config protobuf-compiler libudev-dev
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/kora-publisher/target
          key: publisher-linux-rust198-${{ hashFiles('tools/kora-publisher/Cargo.lock') }}
      - name: Test and build Linux publisher
        working-directory: tools/kora-publisher
        env:
          CARGO_PROFILE_RELEASE_DEBUG: '0'
        run: |
          cargo +1.98.0 test --release --locked
          node --test client/*.test.mjs
          cargo +1.98.0 build --release --locked
          cp target/release/neiro-kora-publisher container/
          ./target/release/neiro-kora-publisher --help
      - name: Publish source-pinned worker image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf %s "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/bropump/neiro-kora-publisher:$GITHUB_SHA"
          docker build -t "$image" tools/kora-publisher/container
          docker run --rm --entrypoint neiro-kora-publisher "$image" --help
          docker push "$image"
          docker logout ghcr.io
