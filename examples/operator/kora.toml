# NEIRO configuration for official Kora. Choose your fee below.
# Keep one pricing option active. To switch, replace the active settings
# under [validation.price] with the settings from the chosen example.

[validation.price]
# OPTION 1 — margin: charge the sponsored cost plus your percentage.
# The percentage applies to the cost you cover, NOT the amount the user sends.
# margin = 0.0 means cost only; 0.10 = +10%; 0.20 = +20%; 0.50 = +50%.
# Example: a sponsored cost worth 10 NEIRO with margin = 0.5 costs the user 15 NEIRO.
type = "margin"
margin = 0.5 # Editable example: sponsored cost plus 50%, paid in NEIRO.

# OPTION 2 — fixed: charge the same total NEIRO fee per transaction.
# Replace the active type/margin lines above with these four lines:
# type = "fixed"
# amount = 10000000
# token = "CTg3ZgYx79zrE1MteDVkmkcGniiFrK1hJ6yiabropump"
# strict = true
# NEIRO has 6 decimals: 1000000 = 1 NEIRO; 10000000 = 10 NEIRO.
# Set amount to your desired total fee in those smallest units.
# strict = true rejects transactions whose estimated cost exceeds your fee.
# strict = false allows you to cover that shortfall from your own SOL.

# OPTION 3 — free: sponsor the transaction without charging the user.
# Replace the active type/margin lines above with this single line:
# type = "free"
# You cover the SOL cost yourself and receive no NEIRO reimbursement.

# Sponsored cost includes required token-account creation (ATA rent) when
# included in the transaction quoted/signed by Kora. Separate setup payments
# made outside Kora are not reimbursed retroactively.
# Your fee is separate from the SOL spending allowance in [validation].
# After editing: validate the config, restart Kora, verify with the router
# and check a fresh quote. More examples: TUTORIAL.md, section 3.

[kora]
rate_limit = 100

[kora.auth]
# Optional: API key for simple authentication
# api_key = "your-api-key"

# Optional: HMAC secret for signed requests
# hmac_secret = "your-hmac-secret"

# Optional: Maximum age in seconds for HMAC timestamp validation (default: 300)
# max_timestamp_age = 300

# Optional: reCAPTCHA v3 secret key for bot protection
# recaptcha_secret = "your-recaptcha-secret"

# Optional: Minimum reCAPTCHA score threshold (0.0 to 1.0, default: 0.5)
# recaptcha_score_threshold = 0.5

# Optional: RPC methods that require reCAPTCHA verification
# protected_methods = ["signTransaction", "signAndSendTransaction", "signBundle", "signAndSendBundle"]

# Lighthouse fee payer protection - adds balance assertions to prevent fee payer drainage
# IMPORTANT: Only works with signTransaction/signBundle flows, NOT signAndSendTransaction/signAndSendBundle
# When lighthouse modifies a transaction (adding assertion instruction), existing client signatures
# become invalid. Use signTransaction → client re-signs → client sends pattern instead.
[kora.lighthouse]
enabled = false
fail_if_transaction_size_overflow = true  # Reject transaction if adding assertion exceeds size limit

# Cache configuration for Redis-based caching
[kora.cache]
enabled = false                    # Enable/disable caching (set to true with url to enable)
url = "redis://localhost:6379"    # Redis connection URL (uncomment and set when enabling cache)
default_ttl = 300                  # Default TTL in seconds (5 minutes)
account_ttl = 60                   # Account data TTL in seconds (1 minute)
price_ttl = 0                     # Token price TTL in seconds (set to 0 to disable price caching while keeping account caching on)

# Enable/disable specific RPC methods
[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
get_supported_tokens = true
sign_transaction = false
sign_and_send_transaction = true
transfer_transaction = false
get_blockhash = true
get_config = true
get_payer_signer = true
get_version = true

[validation]
max_allowed_lamports = 250000000 # 0.25 SOL per transaction; operator may choose another allowance
max_signatures = 10
price_source = "Jupiter"
allow_durable_transactions = false
cross_cluster_check = false
cross_cluster_endpoints = [
    "https://api.mainnet-beta.solana.com",
    "https://api.devnet.solana.com",
    "https://api.testnet.solana.com",
]

# Broad program compatibility. Review sponsor exposure and the pending #683 migration in CONFIGURATION.md.
allowed_programs = "All"
allowed_tokens = [
    "CTg3ZgYx79zrE1MteDVkmkcGniiFrK1hJ6yiabropump", # NEIRO
]
allowed_spl_paid_tokens = ["CTg3ZgYx79zrE1MteDVkmkcGniiFrK1hJ6yiabropump"]
#allowed_spl_paid_tokens = "All"  # Allow any token to be used for payment,
disallowed_accounts = []
# require_one_of_programs = []  # At least one of these programs must be called. Each must also appear in allowed_programs.

# Fee payer policy controls what actions the fee payer can perform
#
# A lot of actions on Solana require System Program and/or SPL Token Programs,
# but those programs have a lot of instructions that can be used to perform actions that could be problematic
# for the fee payer, therefore we allow more granular control over what the fee payer can do with those programs.
[validation.fee_payer_policy]

[validation.fee_payer_policy.system]
allow_transfer = false           # Allow fee payer to be sender in System Transfer/TransferWithSeed
allow_assign = false             # Allow fee payer to be authority in System Assign/AssignWithSeed
allow_create_account = true     # Allow fee payer to be payer in System CreateAccount/CreateAccountWithSeed
allow_allocate = false           # Allow fee payer to be account in System Allocate/AllocateWithSeed

[validation.fee_payer_policy.system.nonce]
allow_initialize = false         # Allow fee payer to initialize nonce accounts
allow_advance = false            # Allow fee payer to advance nonce accounts
allow_authorize = false          # Allow fee payer to authorize nonce accounts
allow_withdraw = false           # Allow fee payer to withdraw from nonce accounts

[validation.fee_payer_policy.spl_token]
allow_transfer = false           # Allow fee payer to be source in SPL token transfers
allow_burn = false               # Allow fee payer to burn SPL tokens
allow_close_account = false      # Allow fee payer to close SPL token accounts
allow_approve = false            # Allow fee payer to approve SPL token delegates
allow_revoke = false             # Allow fee payer to revoke SPL token delegates
allow_set_authority = false      # Allow fee payer to change SPL token authorities
allow_mint_to = false            # Allow fee payer to mint SPL tokens
allow_initialize_mint = false    # Allow fee payer to initialize SPL token mints
allow_initialize_account = false # Allow fee payer to initialize SPL token accounts
allow_initialize_multisig = false # Allow fee payer to be signer in SPL token multisig initialization
allow_freeze_account = false     # Allow fee payer to freeze SPL token accounts
allow_thaw_account = false       # Allow fee payer to thaw SPL token accounts
allow_withdraw_excess_lamports = false # Allow fee payer to be authority in SPL WithdrawExcessLamports
allow_unwrap_lamports = false    # Allow fee payer to be authority in SPL UnwrapLamports

[validation.fee_payer_policy.token_2022]
allow_transfer = false           # Allow fee payer to be source in Token2022 transfers
allow_burn = false               # Allow fee payer to burn Token2022 tokens
allow_close_account = false      # Allow fee payer to close Token2022 accounts
allow_approve = false            # Allow fee payer to approve Token2022 delegates
allow_revoke = false             # Allow fee payer to revoke Token2022 delegates
allow_set_authority = false      # Allow fee payer to change Token2022 authorities
allow_mint_to = false            # Allow fee payer to mint Token2022 tokens
allow_initialize_mint = false    # Allow fee payer to initialize Token2022 mints
allow_initialize_account = false # Allow fee payer to initialize Token2022 accounts
allow_initialize_multisig = false # Allow fee payer to be signer in Token2022 multisig initialization
allow_freeze_account = false     # Allow fee payer to freeze Token2022 accounts
allow_thaw_account = false       # Allow fee payer to thaw Token2022 accounts
allow_withdraw_excess_lamports = false # Allow fee payer to be authority in Token2022 WithdrawExcessLamports
allow_unwrap_lamports = false    # Allow fee payer to be authority in Token2022 UnwrapLamports

[validation.fee_payer_policy.alt]
allow_create = false            # Allow fee payer to be authority/payer in ALT CreateLookupTable
allow_extend = false            # Allow fee payer to be authority/payer in ALT ExtendLookupTable
allow_freeze = false            # Allow fee payer to be authority in ALT FreezeLookupTable
allow_deactivate = false        # Allow fee payer to be authority in ALT DeactivateLookupTable
allow_close = false             # Allow fee payer to be authority in ALT CloseLookupTable

[validation.token_2022]
transfer_hook_policy = "deny_all"
blocked_mint_extensions = [
    # "confidential_transfer_mint",     # Confidential transfer configuration for the mint
    # "confidential_mint_burn",         # Confidential mint and burn configuration
    # "transfer_fee_config",            # Transfer fee configuration
    # "mint_close_authority",           # Authority allowed to close the mint
    # "interest_bearing_config",        # Interest-bearing token configuration
    # "non_transferable",               # Makes tokens non-transferable
    # "permanent_delegate",             # Permanent delegate for the mint
    # "transfer_hook",                  # Block tokens with transfer hooks
    # "pausable",                       # Block pausable tokens
]
blocked_account_extensions = [
    # "confidential_transfer_account", # Confidential transfer state for the account
    # "non_transferable_account",      # Non-transferable token account
    # "transfer_hook_account",          # Transfer hook state for the account
    # "pausable_account",               # Pausable token account state
    # "memo_transfer",                  # Requires memo for transfers
    # "cpi_guard",                      # Prevents certain CPI calls
    # "immutable_owner",                # Account owner cannot be changed
    # "default_account_state",          # Default state for new accounts
]

[metrics]
enabled = true
endpoint = "/metrics"
port = 8080  # Same port as main server, or separate port like 9090
scrape_interval = 60

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30

[kora.usage_limit]
enabled = false
cache_url = "redis://redis:6379"
fallback_if_unavailable = false
rules = []

[kora.plugins]
# Enabled transaction plugins for sign/signAndSend flows.
# Available values: "gas_swap"
enabled = []

[kora.bundle]
enabled = false

[kora.bundle.jito]
block_engine_url = "https://mainnet.block-engine.jito.wtf"
# simulate_bundle_url = "https://mainnet.rpc.jito.wtf"  # Required when bundle.enabled = true
